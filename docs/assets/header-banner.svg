<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 420" width="1260" height="420" fill="none" role="img" aria-label="LightPath Training Portal Hero Banner">
  <defs>
    <!-- Banner Background Obsidian Surface -->
    <linearGradient id="lpbBg" x1="0" y1="0" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="45%" stop-color="#0b1120"/>
      <stop offset="82%" stop-color="#0d182e"/>
      <stop offset="100%" stop-color="#091624"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="lpbGlowLeft" cx="145" cy="138" r="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b0f0" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lpbGlowRight" cx="1010" cy="110" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Specular Border -->
    <linearGradient id="lpbBorder" x1="0" y1="0" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00b0f0" stop-opacity="0.36"/>
    </linearGradient>

    <!-- Title Gradient Accent -->
    <linearGradient id="lpbTitleAccent" x1="490" y1="80" x2="880" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#00b0f0"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Divider Accent -->
    <linearGradient id="lpbDivider" x1="272" y1="186" x2="1206" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b0f0" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.52"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="lpbGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Clip Rounded Banner Bounds -->
    <clipPath id="lpbClip">
      <rect x="2" y="2" width="1256" height="416" rx="22"/>
    </clipPath>

    <!-- Embedded Logo Gradients -->
    <linearGradient id="lpbLogoBg" x1="4" y1="4" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="lpbLogoBeam" x1="28" y1="84" x2="92" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="52%" stop-color="#00b0f0"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Card Surfaces -->
    <linearGradient id="lpbCardBg" x1="0" y1="0" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111a2e" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#090f1d" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="lpbCardEmerald" x1="0" y1="0" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1d1c" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#071112" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- 1. BACKGROUND CANVAS -->
  <g clip-path="url(#lpbClip)">
    <rect x="2" y="2" width="1256" height="416" fill="url(#lpbBg)"/>
    <rect x="2" y="2" width="1256" height="416" fill="url(#lpbGrid)"/>
    <rect x="2" y="2" width="1256" height="416" fill="url(#lpbGlowLeft)"/>
    <rect x="2" y="2" width="1256" height="416" fill="url(#lpbGlowRight)"/>

    <circle cx="143" cy="135" r="102" stroke="#00b0f0" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="6 6"/>
    <circle cx="143" cy="135" r="126" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="3 8"/>
  </g>
  <rect x="2" y="2" width="1256" height="416" rx="22" stroke="url(#lpbBorder)" stroke-width="1.5"/>
  <rect x="6" y="6" width="1248" height="408" rx="19" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- 2. EMBEDDED PORTAL EMBLEM -->
  <g transform="translate(56, 48) scale(1.45)">
    <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#lpbLogoBg)" stroke="#00b0f0" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="7" y="7" width="106" height="106" rx="23" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="60" cy="60" r="41" stroke="#00b0f0" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="5 5"/>
    <circle cx="60" cy="19" r="2.2" fill="#00b0f0"/>
    <circle cx="95.5" cy="80.5" r="2.2" fill="#38bdf8"/>
    <circle cx="24.5" cy="80.5" r="2.2" fill="#10b981"/>
    <path d="M 60 25 L 89 41.5 V 74.5 L 60 91 L 31 74.5 V 41.5 Z" fill="#080e1a" stroke="#00b0f0" stroke-opacity="0.60" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 45 39 V 72 H 75" stroke="url(#lpbLogoBeam)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="39" r="3.4" fill="#7dd3fc"/>
    <circle cx="45" cy="72" r="3.4" fill="#00b0f0"/>
    <circle cx="75" cy="72" r="3.4" fill="#34d399"/>
    <circle cx="74" cy="46" r="10.5" fill="#0b1120" stroke="#10b981" stroke-width="1.8"/>
    <path d="M 69.2 46.2 L 72.5 49.5 L 79.0 42.8" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. HERO TYPOGRAPHY & BADGES -->
  <rect x="272" y="48" width="320" height="26" rx="13" fill="#071f2e" stroke="#00b0f0" stroke-opacity="0.58" stroke-width="1.2"/>
  <circle cx="288" cy="61" r="4" fill="#00b0f0"/>
  <text x="300" y="65" fill="#bae6fd" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.4" font-weight="700" letter-spacing="0.5">ZERO-DEPENDENCY PHP 8.3 · ZERO CDNS</text>

  <rect x="928" y="48" width="278" height="26" rx="13" fill="#0b1c2c" stroke="#38bdf8" stroke-opacity="0.48" stroke-width="1.2"/>
  <text x="1067" y="65" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2" font-weight="700" letter-spacing="0.5">PG18 SANDBOX · QUALIOPI · SCORM 1.2</text>

  <!-- Brand Wordmark -->
  <text x="270" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="50" font-weight="800" letter-spacing="-1.0">
    LightPath <tspan fill="url(#lpbTitleAccent)">Training Portal</tspan>
  </text>

  <!-- Right-Aligned Invariant Summary Pill -->
  <rect x="962" y="92" width="244" height="42" rx="10" fill="#111a2e" stroke="#00b0f0" stroke-opacity="0.48" stroke-width="1.1"/>
  <text x="1084" y="109" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">SECURITY INVARIANTS</text>
  <text x="1084" y="125" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2" font-weight="600">style-src 'self' · lms_student</text>

  <!-- Subtitle -->
  <text x="272" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="500">
    Hands-On Technical LMS · Per-Learner Docker PG18 Sandboxes · 7-Pillar Qualiopi &amp; OPCO Audit Trail
  </text>

  <line x1="272" y1="186" x2="1206" y2="186" stroke="url(#lpbDivider)" stroke-width="1.5"/>

  <!-- Telemetry Row -->
  <g font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.8" font-weight="600">
    <circle cx="277" cy="206" r="3.2" fill="#00b0f0"/>
    <text x="287" y="210" fill="#94a3b8">Storage: <tspan fill="#e2e8f0">JsonStorage · PdoStorage</tspan></text>

    <circle cx="607" cy="206" r="3.2" fill="#38bdf8"/>
    <text x="617" y="210" fill="#94a3b8">Sandbox: <tspan fill="#bae6fd">Docker PG18 · Sakila · pgbench</tspan></text>

    <circle cx="947" cy="206" r="3.2" fill="#10b981"/>
    <text x="957" y="210" fill="#94a3b8">Audit: <tspan fill="#a7f3d0">SHA-256 chain · SVG QR</tspan></text>
  </g>

  <!-- 4. FOUR-STAGE WORKFLOW CARDS -->
  <!-- Stage 01: Learn -->
  <g transform="translate(54, 258)">
    <rect x="0" y="0" width="258" height="114" rx="14" fill="url(#lpbCardBg)" stroke="#00b0f0" stroke-opacity="0.58" stroke-width="1.4"/>
    <rect x="14" y="14" width="32" height="20" rx="6" fill="#00b0f0" fill-opacity="0.20" stroke="#38bdf8" stroke-opacity="0.50" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="800">01</text>
    <text x="54" y="28" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.9">LEARN</text>
    <text x="14" y="61" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="18.5" font-weight="800">Course Engine</text>
    <text x="14" y="83" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">Markdown · Mermaid · 16:9 Slides</text>
    <text x="14" y="99" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">SRS flashcards · Q&amp;A · MP4 range</text>
  </g>

  <g transform="translate(312, 315)">
    <line x1="6" y1="0" x2="30" y2="0" stroke="#00b0f0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 -5 L 32 0 L 24 5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 02: Practice -->
  <g transform="translate(352, 258)">
    <rect x="0" y="0" width="258" height="114" rx="14" fill="url(#lpbCardBg)" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.4"/>
    <rect x="14" y="14" width="32" height="20" rx="6" fill="#38bdf8" fill-opacity="0.20" stroke="#7dd3fc" stroke-opacity="0.50" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#bae6fd" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="800">02</text>
    <text x="54" y="28" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.9">PRACTICE</text>
    <text x="14" y="61" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="18.5" font-weight="800">PG18 Sandbox</text>
    <text x="14" y="83" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">lp_pg18_user_id · lms_student</text>
    <text x="14" y="99" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">savepoints · pgbench · chaos heal</text>
  </g>

  <g transform="translate(610, 315)">
    <line x1="6" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 -5 L 32 0 L 24 5" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 03: Validate -->
  <g transform="translate(650, 258)">
    <rect x="0" y="0" width="258" height="114" rx="14" fill="url(#lpbCardBg)" stroke="#818cf8" stroke-opacity="0.58" stroke-width="1.4"/>
    <rect x="14" y="14" width="32" height="20" rx="6" fill="#818cf8" fill-opacity="0.20" stroke="#a5b4fc" stroke-opacity="0.45" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#c7d2fe" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="800">03</text>
    <text x="54" y="28" fill="#a5b4fc" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.9">VALIDATE</text>
    <text x="14" y="61" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="18.5" font-weight="800">Oracle &amp; Exam</text>
    <text x="14" y="83" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">DO $$ oracles · MCQ diagnostics</text>
    <text x="14" y="99" fill="#c7d2fe" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">timed exam · SHA-256 audit chain</text>
  </g>

  <g transform="translate(908, 315)">
    <line x1="6" y1="0" x2="30" y2="0" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 -5 L 32 0 L 24 5" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 04: Certify -->
  <g transform="translate(948, 258)">
    <rect x="0" y="0" width="258" height="114" rx="14" fill="url(#lpbCardEmerald)" stroke="#10b981" stroke-opacity="0.60" stroke-width="1.4"/>
    <rect x="14" y="14" width="32" height="20" rx="6" fill="#10b981" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.50" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="800">04</text>
    <text x="54" y="28" fill="#34d399" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.9">CERTIFY</text>
    <text x="14" y="61" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="18.5" font-weight="800">Qualiopi Export</text>
    <text x="14" y="83" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">J1..J11 attendance · SVG QR</text>
    <text x="14" y="99" fill="#6ee7b7" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.2">OPCO CSV · JSON · SCORM 1.2</text>
  </g>
</svg>
