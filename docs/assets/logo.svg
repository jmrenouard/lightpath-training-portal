<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="LightPath Training Portal Logo">
  <defs>
    <!-- Obsidian Squircle Surface -->
    <linearGradient id="lpBgSurf" x1="4" y1="4" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Cyan Core Ambient Glow -->
    <radialGradient id="lpCoreGlow" cx="60" cy="54" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b0f0" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Border Accent -->
    <linearGradient id="lpSpecBorder" x1="10" y1="4" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00b0f0" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Luminous LightPath Beam Gradient -->
    <linearGradient id="lpBeamGrad" x1="28" y1="84" x2="92" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="52%" stop-color="#00b0f0"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Inner Shield Plate Gradient -->
    <linearGradient id="lpShieldGrad" x1="36" y1="30" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <!-- Emerald Verification Accent -->
    <linearGradient id="lpVerifyGrad" x1="50" y1="68" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Obsidian Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#lpBgSurf)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#lpCoreGlow)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" stroke="url(#lpSpecBorder)" stroke-width="1.6"/>
  <rect x="7" y="7" width="106" height="106" rx="23" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Orbital Telemetry Ring -->
  <circle cx="60" cy="60" r="41" stroke="#00b0f0" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="5 5"/>
  <circle cx="60" cy="19" r="2.2" fill="#00b0f0"/>
  <circle cx="95.5" cy="80.5" r="2.2" fill="#38bdf8"/>
  <circle cx="24.5" cy="80.5" r="2.2" fill="#10b981"/>

  <!-- Central Hexagonal Training Portal Vault -->
  <path d="M 60 25 L 89 41.5 V 74.5 L 60 91 L 31 74.5 V 41.5 Z"
        fill="url(#lpShieldGrad)"
        stroke="#00b0f0"
        stroke-opacity="0.58"
        stroke-width="1.6"
        stroke-linejoin="round"/>

  <!-- Stylized LightPath L-Prism & Ascending Path -->
  <path d="M 45 39 V 72 H 75"
        stroke="url(#lpBeamGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Guiding Node Pips -->
  <circle cx="45" cy="39" r="3.4" fill="#7dd3fc"/>
  <circle cx="45" cy="72" r="3.4" fill="#00b0f0"/>
  <circle cx="75" cy="72" r="3.4" fill="#34d399"/>

  <!-- Upper-Right Beacon Check Badge -->
  <circle cx="74" cy="46" r="10.5" fill="#0b1120" stroke="url(#lpVerifyGrad)" stroke-width="1.8"/>
  <path d="M 69.2 46.2 L 72.5 49.5 L 79.0 42.8"
        stroke="#34d399"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
