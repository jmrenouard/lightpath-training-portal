      - Changelog: CHANGELOG.md
      - Action Logbook: ACTION_LOGBOOK.md
      - RCA Register: RCA_REGISTER.md
      - Contributing Guide: CONTRIBUTING.md
      - Project Context: PROJECT-CONTEXT.md
      - Security Policy: SECURITY-POLICY.md
